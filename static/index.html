<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthcare RAG Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <h1 class="brand">Healthcare RAG Chat</h1>
        <p class="sub">
          Ask questions grounded in openly attributed WHO, FDA / Health Canada / MHRA,
          NCI, and MedlinePlus excerpts. Not medical advice.
        </p>
        <div class="meta-row">
          <span class="pill" id="healthPill">Connecting…</span>
          <span class="pill">Corpus-only answers</span>
          <a class="pill" href="/docs" style="text-decoration: none; color: inherit"
            >API docs</a
          >
        </div>
      </header>

      <main class="shell">
        <div class="toolbar">
          <label>
            API key
            <input
              id="apiKey"
              type="password"
              autocomplete="off"
              placeholder="dev-secret-change-me"
            />
          </label>
          <button class="ghost" id="clearBtn" type="button">Clear chat</button>
        </div>

        <div class="suggestions" id="suggestions">
          <button type="button" data-q="What are the benefits and negatives of using AI in the healthcare field?">
            AI benefits &amp; risks
          </button>
          <button type="button" data-q="What are the WHO ethical principles for AI in health?">
            WHO ethics principles
          </button>
          <button type="button" data-q="What are microcalcifications on a mammogram?">
            Microcalcifications
          </button>
          <button type="button" data-q="What are the benefits and harms of breast cancer screening?">
            Screening benefits &amp; harms
          </button>
          <button type="button" data-q="What is Good Machine Learning Practice for medical devices?">
            GMLP principles
          </button>
        </div>

        <div class="chat" id="chat" aria-live="polite"></div>
        <div class="status" id="status"></div>

        <form class="composer" id="composer">
          <textarea
            id="input"
            rows="2"
            placeholder="Ask about AI in health, mammography, GMLP, transparency…"
            required
          ></textarea>
          <button id="sendBtn" type="submit">Send</button>
        </form>
      </main>

      <p class="footer-note">
        Sources and licences are shown under each answer. See
        <code>data/SOURCES.md</code> on GitHub for provenance.
      </p>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
